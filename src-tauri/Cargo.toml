[package]
name = "runa"
version = "0.1.0"
description = "Runa - 现代化 Minecraft 启动器"
authors = ["tortb"]
edition = "2021"

[lib]
# `_lib` 后缀在 Windows 上避免与 bin 名冲突,见 https://github.com/rust-lang/cargo/issues/8519
name = "runa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"
toml = "1.1.4"
dirs = "6.0.0"
uuid = { version = "1.25.0", features = ["v4"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "native-tls"] }
