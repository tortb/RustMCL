[package]
name = "rustmcl"
version = "0.1.1"
description = "RustMCL - 现代化 Minecraft 启动器"
authors = ["tortb"]
edition = "2021"

[lib]
# `_lib` 后缀在 Windows 上避免与 bin 名冲突,见 https://github.com/rust-lang/cargo/issues/8519
name = "rustmcl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"
toml = "1.1.4"
dirs = "6.0.0"
uuid = { version = "1.25.0", features = ["v4"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "sync"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "form", "stream", "query", "native-tls"] }
futures-util = "0.3"
sha1 = "0.10"
md-5 = "0.10"
regex = "1"
sysinfo = "0.33"
zip = { version = "2", default-features = false, features = ["deflate"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# 开发构建内存优化(8G 机器):
# 默认 dev 会生成完整 DWARF 调试信息,编译依赖时内存与产物体积都很大。
# 改为仅行号表(debug=1),显著降低峰值内存,同时保留 panic 回溯的行号。
[profile.dev]
debug = 1
